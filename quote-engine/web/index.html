      THESIS: a quote is an argument, so the surface is an instrument panel that
      states its readings and cites them. It refuses the card grid: white rounded
      panels on grey, identical on every screen, was the arrangement here before.
      OWN-WORLD: BRAND.md palette and type, unchanged and shared with Planning
      Analytics. What is new is structural — square panels, navy silkscreen legend
      bands over a 2px rule, hairline divisions instead of gaps, a label gutter with
      figures sharing one right-aligned mono column, radius reserved for things you
      can press, and no shadow on anything that is not floating.
      STORY: the rep sees what was captured, what the rules made of it, and which
      document each figure came from — then sends it knowing it can be defended.
      FIRST VIEWPORT: three equal doors into a quote, then the rep's own quotes as a
      ruled list; on a phone the same list stacked, never a table dragged sideways.
      FORM: industrial instrument panel — 7th of 7 on my grounded list, ordered by
      resonance. Seed key dcc2be72, assigned index 7, scope surface, mode operate.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md.
    -->
